name: Phase 7 Production Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleaning_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cleaning_crm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PROCESS_ROLE: api
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cleaning_crm_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/cleaning_crm_test?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      BETTER_AUTH_SECRET: replace-ci-better-auth-secret-with-32-plus-chars
      BETTER_AUTH_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:5000
      FRONTEND_URL: http://127.0.0.1:5000
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:5000,http://localhost:5000
      ACCESS_TOKEN_SECRET: replace-ci-access-token-secret-with-64-plus-random-characters
      REFRESH_TOKEN_SECRET: replace-ci-refresh-token-secret-with-different-64-plus-random-characters
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 30d
      SMTP_EMAIL: no-reply@example.com
      SMTP_PASSWORD: replace-ci-smtp-password
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2525"
      SMTP_SECURE: "false"
      SMTP_FROM: no-reply@example.com
      SUPER_ADMIN_EMAIL: admin@example.com
      SUPER_ADMIN_PASSWORD: replace-ci-bootstrap-password
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: replace-ci-cloudinary-secret
      NEXT_REVALIDATE_SECRET: replace-ci-revalidate-secret-with-32-plus-chars
      PERFORMANCE_METRICS_TOKEN: replace-ci-monitoring-token-with-32-plus-chars
      WEBSITE_BASE_DOMAIN: sites.example.com
      WEBSITE_CNAME_TARGET: sites.example.com
      WEBSITE_CUSTOM_DOMAINS_ENABLED: "false"
      GOOGLE_ANALYTICS_OAUTH_CLIENT_ID: ""
      GOOGLE_ANALYTICS_OAUTH_CLIENT_SECRET: ""
      GOOGLE_ANALYTICS_TOKEN_ENCRYPTION_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm run check:repo-hygiene
      - run: pnpm run check:secrets
      - run: pnpm run check:production-cleanup
      - run: pnpm run check:reliability
      - run: pnpm run check:release-infra
      - run: pnpm run test:security
      - run: pnpm run test:integration
      - run: pnpm run check:phase4
      - run: pnpm run test:phase4:super-admin
      - run: pnpm run data:audit:super-admin:ci
      - run: pnpm run verify:phase4:production-gate
      - run: pnpm run db:reconcile
      - run: PERF_ADMIN_ID=ci-empty-tenant PERF_DB_TARGET_MS=100 pnpm run perf:phase4:explain
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
