# Phase 3 primary-region production topology for Cleaning CRM.
# Serve users globally through the frontend/CDN edge, while API, PostgreSQL,
# Redis and DB-heavy worker/scheduler processes stay in one primary region.
# This compose file keeps API/worker/scheduler/Redis on the same VM/VPC; point
# DATABASE_URL at PostgreSQL in the same/nearby provider region.
# Secrets and explicit region labels are loaded from .env.runtime.

x-app-common: &app-common
  build:
    context: .
    target: production
  restart: always
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  env_file:
    - .env
  environment: &common-environment
    NODE_ENV: production
    DEPLOYMENT_PROFILE: primary-region
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_DB: 0
    REDIS_REGION: local
    PRIMARY_REGION: us-east-1
    APP_REGION: us-east-1
    DATABASE_REGION: us-east-1
    REQUIRE_COLOCATED_INFRA: "false"
    TRUST_PROXY_HOPS: 1
    FRONTEND_URL: https://cleaningcrm.opygen.com
    APP_URL: https://cleaningcrm.opygen.com
    BETTER_AUTH_URL: https://api.opygen.com
    COOKIE_DOMAIN: .opygen.com
    AUTH_ALLOWED_ORIGINS: https://cleaningcrm.opygen.com
    ACCESS_TOKEN_EXPIRES_IN: 15m
    REFRESH_TOKEN_EXPIRES_IN: 30d
    PERFORMANCE_METRICS_TOKEN: 72b6597c9a90a5c88652494f37d6da57894888763d49cdlwfjoer234234
    NEXT_REVALIDATE_SECRET: 72b6597c9a90a5c88652494f37d6da57894888763d49cdlwfjoer234234
    NEXT_REVALIDATE_URL: https://cleaningcrm.opygen.com/api/public-site/revalidate
    CHOKIDAR_USEPOLLING: "1"
    WATCHPACK_POLLING: "true"
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - crm_network

services:
  api:
    <<: *app-common
    container_name: cleaning_crm_api
    command: ["node", "dist/index.js"]
    environment:
      <<: *common-environment
      PROCESS_ROLE: api
      PORT: 3000
      BACKEND_IP: 0.0.0.0
      OUTBOX_WORKER_ENABLED: "true"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/livez"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Explicit one-shot seed/bootstrap task. Never runs with normal compose up.
  bootstrap:
    <<: *app-common
    profiles: ["bootstrap"]
    restart: "no"
    command: ["node", "dist/processes/bootstrap.js"]
    environment:
      <<: *common-environment
      PROCESS_ROLE: bootstrap

  # Explicit release-only schema migration. Run before app rollout.
  migrate:
    build:
      context: .
      target: migration
    profiles: ["release"]
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEPLOYMENT_PROFILE: primary-region
      REDIS_REGION: local
      REQUIRE_COLOCATED_INFRA: "true"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crm_network

  redis:
    image: redis:7-alpine
    container_name: cleaning_crm_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - crm_network

  caddy:
    image: caddy:2-alpine
    container_name: cleaning_crm_caddy
    restart: always
    environment:
      API_DOMAIN: api.opygen.com
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - crm_network

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  crm_network:
    driver: bridge
