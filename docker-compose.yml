# Phase 3 primary-region production topology for Cleaning CRM.
# Serve users globally through the frontend/CDN edge, while API, PostgreSQL,
# Redis and DB-heavy worker/scheduler processes stay in one primary region.
# This compose file keeps API/worker/scheduler/Redis on the same VM/VPC; point
# DATABASE_URL at PostgreSQL in the same/nearby provider region.
# Secrets and explicit region labels are loaded from .env.runtime.

x-app-common: &app-common
  build:
    context: .
    target: production
  restart: always
  env_file:
    - .env.runtime
  environment: &common-environment
    NODE_ENV: production
    DEPLOYMENT_PROFILE: primary-region
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_DB: 0
    # PRIMARY_REGION, APP_REGION and DATABASE_REGION must be set in .env.runtime.
    # REDIS_REGION=local resolves to APP_REGION at runtime. PROCESS_REGION
    # defaults to APP_REGION for these colocated API/worker/scheduler services.
    REDIS_REGION: local
    REQUIRE_COLOCATED_INFRA: "true"
    # Exactly one trusted reverse-proxy hop: Caddy -> API.
    TRUST_PROXY_HOPS: 1
    FRONTEND_URL: https://cleaningcrm.opygen.com
    APP_URL: https://cleaningcrm.opygen.com
    BETTER_AUTH_URL: https://api.opygen.com
    # Optional rollout-only cleanup scope for legacy Domain=.opygen.com cookies.
    # Canonical access/refresh/session cookies are host-only.
    COOKIE_DOMAIN: .opygen.com
    AUTH_ALLOWED_ORIGINS: https://cleaningcrm.opygen.com
    ACCESS_TOKEN_EXPIRES_IN: 15m
    REFRESH_TOKEN_EXPIRES_IN: 30d
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - crm_network

services:
  api:
    <<: *app-common
    container_name: cleaning_crm_api
    command: ["node", "dist/index.js"]
    environment:
      <<: *common-environment
      PROCESS_ROLE: api
      PORT: 3000
      BACKEND_IP: 0.0.0.0
      OUTBOX_WORKER_ENABLED: "false"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/livez"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    <<: *app-common
    container_name: cleaning_crm_worker
    command: ["node", "dist/worker.js"]
    environment:
      <<: *common-environment
      PROCESS_ROLE: worker
      OUTBOX_WORKER_ENABLED: "true"

  scheduler:
    <<: *app-common
    container_name: cleaning_crm_scheduler
    command: ["node", "dist/scheduler.js"]
    environment:
      <<: *common-environment
      PROCESS_ROLE: scheduler
      # Cloud SQL is always-on; disable DB keepalive unless your provider needs it.
      DB_KEEPALIVE_ENABLED: "false"

  # Explicit one-shot seed/bootstrap task. Never runs with normal compose up.
  bootstrap:
    <<: *app-common
    profiles: ["bootstrap"]
    restart: "no"
    command: ["node", "dist/bootstrap.js"]
    environment:
      <<: *common-environment
      PROCESS_ROLE: bootstrap

  # Explicit release-only schema migration. Run before app rollout.
  migrate:
    build:
      context: .
      target: migration
    profiles: ["release"]
    restart: "no"
    env_file:
      - .env.runtime
    environment:
      NODE_ENV: production
      DEPLOYMENT_PROFILE: primary-region
      REDIS_REGION: local
      REQUIRE_COLOCATED_INFRA: "true"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crm_network

  redis:
    image: redis:7-alpine
    container_name: cleaning_crm_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - crm_network

  caddy:
    image: caddy:2-alpine
    container_name: cleaning_crm_caddy
    restart: always
    environment:
      API_DOMAIN: api.opygen.com
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - crm_network

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  crm_network:
    driver: bridge
